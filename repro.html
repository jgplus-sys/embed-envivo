<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG Plus - Visor</title>

<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #contenedor {
        position: relative; width: 100vw; height: 100vh;
    }

    /* CAPA DEL MENSAJE Y CARGA */
    #mensaje {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        text-align: center;
        z-index: 999;
        padding: 20px;
        box-sizing: border-box;
    }

    /* LA PELOTITA CARGANDO (SPINNER) */
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid #a020f0; /* Color morado neón para JG Plus */
        border-radius: 50%;
        animation: girar 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes girar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .texto-principal {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #fff;
    }

    .texto-advertencia {
        font-size: 14px;
        color: #bbb;
        max-width: 300px;
        line-height: 1.4;
    }

    iframe {
        width: 100%; height: 100%;
        border: 0;
        position: absolute;
        top: 0; left: 0;
        z-index: 1;
    }
</style>
<script src="https://pl26407245.effectivecpmnetwork.com/07/39/5d/07395dd764e3a8ba7184415f1a6411af.js"></script>
</head>

<body>

<div id="contenedor">
    <div id="mensaje">
        <div class="spinner"></div>
        <div class="texto-principal">JG Plus | Agregando canal...</div>
        <div class="texto-advertencia">
            El canal puede tardar hasta 5 minutos después del inicio del partido en activarse.
        </div>
    </div>

    <iframe 
        id="player"
        src="https://dembed.st/premiumtv/daddy.php?id=870" 
        width="100%" 
        height="100%" 
        scrolling="no" 
        frameborder="0" 
        allowfullscreen="true" 
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen" 
        allowtransparency="true">
    </iframe>  
</div>

<script>
    var iframe = document.getElementById("player");
    var mensaje = document.getElementById("mensaje");

    function verificarContenido() {
        var url = iframe.getAttribute("src");

        if (url && url.trim() !== "" && url !== "about:blank") {
            setTimeout(function() {
                mensaje.style.display = "none";
            }, 1000);
        } else {
            mensaje.style.display = "flex";
        }
    }

    verificarContenido();
</script>
  
</body>
</html>
